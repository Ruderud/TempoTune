version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    # Remove these temporary guards after the React Native migration lands.
    ignore:
      - dependency-name: react
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
      - dependency-name: '@react-native/*'
        update-types:
          - version-update:semver-minor
      - dependency-name: '@react-native-community/cli*'
        update-types:
          - version-update:semver-major
    groups:
      production-minor-patches:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patches:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    groups:
      github-actions:
        patterns:
          - '*'
