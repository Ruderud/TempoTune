name: 'Setup pnpm & Node.js'
description: 'Install pnpm, Node.js 24, and project dependencies'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
